      - src/Coquena/Models/ModelResolution.cs
      - src/Coquena/Models/HuggingFaceStore.cs
      - src/Coquena/Models/RemoteGgufInspector.cs
      - src/Coquena/Models/ModelInstaller.cs
      - src/Coquena/Models/HuggingFaceTransport.cs
      - src/Coquena/Models/FileIntegrity.cs
