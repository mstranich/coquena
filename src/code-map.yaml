# Partial, manually maintained navigation map. Paths are relative to the repository root.
# Start at entrypoints, follow implementation as needed, then inspect relevant tests.
# References describe intended behavior; verify actual behavior in code and tests.
version: 1
features:
  - id: recipe-argument-schema-emission
    intent: Componer definiciones locales, validar argumentos y relaciones, consultar impacto y emitir tokens CLI o INI con codec por build.
    keywords: [arg-defs, schema, param, aliases, args-mode, rules, CLI, INI, interpolation]
    entrypoints:
      - src/Coquena/Recipes/ArgumentSchema.cs
      - src/Coquena/Recipes/ArgumentValidation.cs
      - src/Coquena/Recipes/ArgumentEmission.cs
    implementation:
      - src/Coquena/Recipes/RecipeVariables.cs
      - src/Coquena/Recipes/RecipeValue.cs
    tests:
      - tests/Coquena.Tests/ArgumentTests.cs
    references:
      - docs/catalogo-de-parametros.md
      - docs/formato-proyecto.md

  - id: recipe-reading-composition
    intent: Leer capas YAML y env explícitas, validar estructura y consultar intención efectiva sin preparar ni ejecutar.
    keywords: [recipe, YAML, env, interpolation, overrides, provenance, target, literal]
    entrypoints:
      - src/Coquena/Recipes/RecipeReader.cs
    implementation:
      - src/Coquena/Recipes/RecipeYaml.cs
      - src/Coquena/Recipes/RecipeVariables.cs
      - src/Coquena/Recipes/RecipeStructure.cs
      - src/Coquena/Recipes/RecipeValue.cs
    tests:
      - tests/Coquena.Tests/RecipeTests.cs
    references:
      - docs/formato-proyecto.md
      - docs/definiciones-declarativas.md
      - docs/servicios-recetas.md
      - docs/comandos.md

  - id: project-context-persistence
    intent: Separar ámbitos, registrar identidades locales y publicar generaciones recuperables entre proyectos y servicios.
    keywords: [scope, project, recipe registry, identity, generation, recovery, .coquena, projects.json]
    entrypoints:
      - src/Coquena/Projects/ScopeContext.cs
      - src/Coquena/Projects/RecipeRegistry.cs
    implementation:
      - src/Coquena/Projects/PhysicalDirectory.cs
      - src/Coquena/Projects/ProjectDocuments.cs
      - src/Coquena/Projects/ScopeStore.cs
      - src/Coquena/Projects/ProjectIndex.cs
    tests:
      - tests/Coquena.Tests/ProjectPersistenceTests.cs
    references:
      - docs/persistencia-proyectos.md
      - docs/formato-proyecto.md
      - docs/servicios-recetas.md

