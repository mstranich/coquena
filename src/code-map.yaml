      - tests/Coquena.Tests/ResolutionTests.cs
      - tests/Coquena.Tests/ModelInstallerTests.cs
      - tests/Coquena.Tests/GgufTests.cs
    references:
      - docs/modelos-y-companions.md
      - docs/descargas.md

  - id: download-pause-resume
    intent: Localizar transferencias, pausa, reanudación y publicación tras completar una descarga.
