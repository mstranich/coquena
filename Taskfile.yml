version: '3'

vars:
  WEB_DIR: apps/web
  DEV_HOME: '{{.ROOT_DIR}}/home'
  GOEXE:
    sh: go env GOEXE
  DEV_RUNNER: '{{.ROOT_DIR}}/.tmp/dev/devrun{{.GOEXE}}'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  tools:
    desc: Print and verify the development toolchain
    cmds:
      - go version
      - node --version
      - npm --version
      - task --version
      - air -v
    preconditions:
      - sh: go version
        msg: Go 1.26.5 or newer is required
      - sh: node --version
        msg: Node.js 24.18.0 or newer is required
      - sh: npm --version
        msg: npm 11.16.0 or newer is required
      - sh: air -v
        msg: Air is required for hot reload; install it with go install github.com/air-verse/air@v1.67.2

  deps:
    desc: Restore all workspace dependencies
    deps: [backend:deps, web:deps]

  verify:
    desc: Verify the complete workspace
    cmds:
      - task: docs:validate
      - task: web:verify
      - task: backend:verify

  docs:validate:
    desc: Check that the documentation registries and their references resolve
    cmds:
      - node scripts/docs-validate.mjs

  docs:map:
    desc: Print the documentation graph — what governs, what was superseded, what is open
    cmds:
      - node scripts/docs-map.mjs

  docs:status:
    desc: Print open RFCs, backlog entries, and changes named but not created
    cmds:
      - node scripts/docs-status.mjs

  bootstrap:
    desc: Verify tools, restore dependencies, and verify the workspace
    cmds:
      - task: tools
      - task: deps
      - task: verify

  backend:deps:
    desc: Restore and verify Go module dependencies
    cmds:
      - go mod download
      - go mod verify

  backend:fmt-check:
    desc: Format Go packages
    cmds:
      - go fmt ./...

  backend:test:
    desc: Run Go tests
    cmds:
      - go test ./...

  backend:build:
    desc: Build the Coquena executable
    deps: [web:build]
    cmds:
      - go build -o bin/ ./cmd/coquena

  backend:verify:
    desc: Format-check, test, and build the backend
    cmds:
      - task: backend:fmt-check
      - task: backend:test
      - task: backend:build

  dev:
    desc: Start the frontend and hot-reloading backend
    interactive: true
    cmds:
      - node scripts/prepare-dev.mjs
      - go build -o '{{.DEV_RUNNER}}' ./tools/devrun
      - '{{.DEV_RUNNER}}'

  dev:backend:
    desc: Watch and restart the backend with the development home
    env:
      COQUENA_HOME: '{{.DEV_HOME}}'
    cmds:
      - node scripts/prepare-dev.mjs
      - air -c .air.toml

  clean:
    desc: Remove mutable development state and disposable build artifacts
    cmds:
      - node scripts/clean-home.mjs

  web:deps:
    desc: Restore frontend dependencies from the lockfile
    dir: '{{.WEB_DIR}}'
    cmds:
      - npm ci

  web:test:
    desc: Run frontend tests once
    dir: '{{.WEB_DIR}}'
    cmds:
      - npm test -- --watch=false

  web:build:
    desc: Build the frontend for production
    dir: '{{.WEB_DIR}}'
    cmds:
      - npm run build

  web:serve:
    desc: Start the Angular development server
    dir: '{{.WEB_DIR}}'
    cmds:
      - npm start

  web:verify:
    desc: Check formatting and lint, then test and build the frontend
    cmds:
      - task: web:format-check
      - task: web:lint
      - task: web:test
      - task: web:build

  web:format-check:
    desc: Verify frontend source formatting
    dir: '{{.WEB_DIR}}'
    cmds:
      - npm run format:check

  web:lint:
    desc: Lint frontend sources
    dir: '{{.WEB_DIR}}'
    cmds:
      - npm run lint
