name: Documentación

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - docs-site/**
      - zensical.toml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: astral-sh/setup-uv@v10.3.2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends graphviz
      - run: uv run docs-site/build.py
      - run: uvx zensical@0.0.73 build --clean --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: artifacts/docs-site/site
      - uses: actions/deploy-pages@v5
        id: deployment
