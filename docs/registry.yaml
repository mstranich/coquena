# Index of every written artifact under docs/.
#
# One registry, five kinds. Documents live in a directory per kind; this file is
# the only place that records what they are and how they relate.
#
# kind      state vocabulary                        closes?
# story     current | superseded                    no — needs change, they do not complete
# finding   current | superseded | refuted          no — a fact about the world stays findable
# usecase   current | superseded                    no — it evolves
# backlog   open | blocked | closed | superseded    yes — closed when a change lands
# rfc       open | closed | superseded              yes — closed by the project owner
#
# Relations are written once, on the artifact they belong to, and never
# mirrored: a one-way link cannot exist if there is only one place to write it.
#
#   motivated-by  why this artifact exists (backlog -> finding, finding -> story)
#   produces      work this artifact results in (an OpenSpec change)
#   blocked-by    cannot proceed until the target lands
#   supersedes    replaces the target, which keeps its document and turns superseded
#   relates-to    a weaker association worth recording
#
# A target may name another artifact here or an OpenSpec change. A closed
# artifact's `produces` targets must exist; an open one's may still be a plan.

