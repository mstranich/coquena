    const to=({Y:{Cancelar:"H",Sí:"P",No:"H"},X:{Cancelar:"B"},S:{Cancelar:"W",Agregar:"W"},M:{"+ Agregar":"T"},T:{Cancelar:"M",Agregar:"M","Ir a backends":"O"},O:{"+ Backend":"K"},V:{Cancelar:"B"},N:{Cancelar:"N",Reintentar:"N"},Z:{Reintentar:"N"}}[ids[i]]||{})[k]||(local&&k==="Parámetros"?"Q2":LINKS[k]);
    if(to&&!sp.querySelector("span")){sp.classList.add("lnk");sp.title="→ "+to;sp.onclick=()=>go(to);}});
  const pre=t.querySelector("pre");const rows=pre.innerHTML.split("\n");
  rows.slice(-2).forEach(()=>{});});
document.querySelectorAll(".term pre").forEach(pre=>{const spans=[...pre.querySelectorAll("span.bar")];
  spans.forEach(sp=>{sp.classList.add("lnk");sp.title="→ D";sp.onclick=()=>go("D");});});
let single=true;
function show(){terms.forEach((t,i)=>{const on=!single||t.dataset.cur==="1";t.style.display=on?"":"none";heads[i].style.display=on?"":"none";});
  document.getElementById("bAll").classList.toggle("on",!single);document.getElementById("bNav").classList.toggle("on",single);}
function go(id){terms.forEach(t=>t.dataset.cur=t.id==="s"+id?"1":"0");if(!single)document.getElementById("h"+id).scrollIntoView({behavior:"smooth"});show();
  try{history.replaceState(null,"","#"+id)}catch(e){}}
const tb=document.getElementById("toolbar");
tb.innerHTML='<button id="bNav">Navegar</button><button id="bAll">Ver todas</button> '+ids.map(i=>`<button data-i="${i}">${i}</button>`).join("");
tb.onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.id==="bNav"){single=true;show();}else if(b.id==="bAll"){single=false;show();}else{single=true;go(b.dataset.i);}};
go((location.hash||"#A").slice(1)||"A");
</script>
