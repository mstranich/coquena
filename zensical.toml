# Sitio de documentación de Coquena. Las fuentes se preparan con
# `uv run docs-site/build.py` (copia de docs/ con el manual en la raíz)
# y se construyen con `uvx zensical build --clean` o `uvx zensical serve`.

[project]
site_name = "Coquena"
site_description = "User guide and design documentation for Coquena"
site_author = "Maximiliano Stranich"
# Único lugar con la URL pública; con dominio propio basta cambiarla y agregar CNAME.
site_url = "https://mstranich.github.io/coquena/"
repo_url = "https://github.com/mstranich/coquena"
repo_name = "mstranich/coquena"
docs_dir = "artifacts/docs-site/docs"
site_dir = "artifacts/docs-site/site"
extra_css = ["stylesheets/coquena.css"]

nav = [
  { "Overview" = "README.md" },
  { "Getting started" = "getting-started.md" },
  { "Global and local" = "global-and-local.md" },
  { "Recipes" = "recipes.md" },
  { "Services and backends" = "services-and-backends.md" },
  { "Models and Presets" = "models-and-presets.md" },
  { "Maintenance" = "maintenance.md" },
  { "Configuration" = "configuration.md" },
  { "CLI reference" = "cli-reference.md" },
  { "Troubleshooting" = "troubleshooting.md" },
  { "Roadmap" = [
    { "Overview" = "milestones/README.md" },
    { "M1" = "milestones/M1-servidor-local.md" },
    { "M2" = "milestones/M2-gestion-completa.md" },
    { "M3" = "milestones/M3-definiciones-declarativas.md" },
    { "M4" = "milestones/M4-experiencia-completa.md" },
  ] },
  { "Design" = [
    { "Inicio" = "design/README.md" },
    { "Reglas" = [
      { "Formato del proyecto" = "design/formato-proyecto.md" },
      { "Servicios y recetas" = "design/servicios-recetas.md" },
      { "Persistencia de proyectos" = "design/persistencia-proyectos.md" },
      { "Definiciones declarativas" = "design/definiciones-declarativas.md" },
      { "Servidores" = "design/servidores.md" },
      { "Modelos y companions" = "design/modelos-y-companions.md" },
      { "Descargas" = "design/descargas.md" },
      { "Parámetros" = "design/catalogo-de-parametros.md" },
      { "Actualización y limpieza" = "design/actualizacion-y-limpieza.md" },
      { "Observabilidad" = "design/observabilidad.md" },
      { "Privacidad y datos compartibles" = "design/privacidad.md" },
    ] },
    { "Interfaces" = [
      { "Interfaces visuales" = "design/interfaces-visuales.md" },
      { "Pantalla Servicios" = "design/ui-servicio.md" },
      { "Comandos" = "design/comandos.md" },
    ] },
    { "Modelos" = [
      { "Modelo de datos" = "design/modelo-de-datos.md" },
      { "Estados" = "design/estados.md" },
      { "Casos de uso" = "design/casos-de-uso.md" },
      { "Secuencias" = "design/secuencias.md" },
      { "Actividades" = "design/actividades.md" },
    ] },
    { "Referencia" = [
      { "Benchmarking" = "design/benchmarking.md" },
      { "Glosario" = "design/glosario.md" },
    ] },
    { "Guía técnica" = "design/guia-tecnica.md" },
  ] },
]

[project.theme]
language = "en"
logo = "assets/coquena-logo.png"
favicon = "assets/coquena-favicon.png"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.palette]
scheme = "coquena"
primary = "custom"
accent = "custom"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
toc.slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tasklist.custom_checkbox = true
